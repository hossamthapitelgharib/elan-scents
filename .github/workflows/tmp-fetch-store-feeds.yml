name: Fetch public store feeds (temporary)

# Temporary (owner approved on 2026-11-20): saves the PUBLIC product pages of the two trial stores (Afnan Egypt, Emarati Scents), because the
# working session cannot open those sites. Runs only on the temporary branch tmp/fetch-store-feeds, reads public pages only (no login,
# no secret), few requests with a pause between them. The result goes to the temporary branch tmp/store-feeds-data, which is emptied afterwards.

on:
  push:
    branches: [tmp/fetch-store-feeds]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the public pages
        run: |
          mkdir -p feeds offers
          cat > fetch.py <<'PY'
          import json, time, urllib.request, urllib.error
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          STORES = {'afnan-egypt': 'https://egypt.afnan.com', 'emarati-scents': 'https://emaratiscents.com'}
          def get(url):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      print('  http', e.code, url); return e.code, b''
                  except Exception as e:
                      print('  retry', attempt, url, e); time.sleep(3)
              return 0, b''
          def save(path, data):
              open(path, 'wb').write(data); print('saved', path, len(data), 'bytes')
          for name, base in STORES.items():
              print('==', name)
              page = 1
              while page <= 30:
                  st, raw = get(f'{base}/products.json?limit=250&page={page}')
                  if st != 200: break
                  d = json.loads(raw).get('products', [])
                  if not d: break
                  save(f'feeds/{name}-page-{page}.json', raw)
                  page += 1; time.sleep(2)
              print(' pages:', page - 1)
          st, raw = get('https://egypt.afnan.com/collections/11-11-sale/products.json?limit=250')
          if st == 200:
              ps = json.loads(raw).get('products', [])
              save('offers/afnan-egypt-col-11-11-sale.json', json.dumps({'collection': {'handle': '11-11-sale'}, 'products': [{'handle': p['handle'], 'title': p['title']} for p in ps]}, ensure_ascii=False).encode())
              print(' sale products:', len(ps))
          PY
          python3 fetch.py
          ls -l feeds offers
      - name: Hand the files to the working session (temporary data branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gzip -9 feeds/* offers/*
          mkdir handoff && cp -r feeds offers handoff/
          cd handoff
          git init -q -b tmp/store-feeds-data
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add feeds offers
          git commit -qm 'tmp: public product pages of the two trial stores (to be emptied)'
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp/store-feeds-data
