name: Live editor check

# Opens the editor of the REAL site in a real Chromium, signs in as the owner and compares the panels (library, section, perfume card, brand,
# store, picture/video source, text format) with the owner's original editor file (scripts/live-editor-check.js). It never presses save and
# changes nothing. The sign-in comes from two repository secrets that only the owner can add (Settings > Secrets and variables > Actions):
#   EDITOR_LIVE_EMAIL and EDITOR_LIVE_PASSWORD
# The values are never written to a file, a log or the screenshots (the login page is not photographed). Without the secrets the run only
# says what to add. Run it by hand from the Actions tab (Run workflow); it also runs when the script itself changes.
# Known limit (found 2026-11-07 from the run's own diagnostics): the sign-in waits for Cloudflare's security check (Turnstile), and a headless
# CI browser is not given a token, so with the secrets set the run ends with a NOT CHECKED warning, not a pass. A real run needs a sign-in
# path that does not depend on that check, which is a security decision for the owner (see docs/handoff.ar.md).
# The screenshots are kept for one day as the "live-editor-shots" artifact (they show the public site and the catalogue lists, no customer data).

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site address to open
        default: https://elan-scents.hossamthapitelgharib.workers.dev
  push:
    paths:
      - scripts/live-editor-check.js
      - .github/workflows/live-editor-check.yml

permissions:
  contents: read

jobs:
  editor:
    if: github.repository == 'hossamthapitelgharib/elan-scents'
    # pinned like the browser job in tests.yml: Playwright 1.56 has no Chromium build for the newer ubuntu-latest image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Open the live editor
        env:
          SITE_URL: ${{ github.event.inputs.url || 'https://elan-scents.hossamthapitelgharib.workers.dev' }}
          EDITOR_LIVE_EMAIL: ${{ secrets.EDITOR_LIVE_EMAIL }}
          EDITOR_LIVE_PASSWORD: ${{ secrets.EDITOR_LIVE_PASSWORD }}
        run: node scripts/live-editor-check.js "$SITE_URL" live-editor-shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-editor-shots
          path: live-editor-shots
          retention-days: 1
          if-no-files-found: ignore
