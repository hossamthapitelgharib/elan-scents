<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>إيلان إديتور — كلمة سر جديدة</title>
<link rel="stylesheet" href="/editor-login.css">
</head>
<body>
<header class="top"><b>إيلان إديتور</b></header>
<main class="card narrow">
  <h2>كلمة سر جديدة</h2>
  <p id="state" class="msg"></p>
  <section id="resetBox" hidden>
    <label>كلمة السر الجديدة<input id="newPass" type="password" autocomplete="new-password"></label>
    <label>اكتبها مرة تانية<input id="newPass2" type="password" autocomplete="new-password"></label>
    <p class="hint">10 حروف أو أكتر.</p>
    <button id="resetBtn" class="primary">حفظ كلمة السر</button>
  </section>
  <p class="aside"><a href="/editor" id="backLink">رجوع لصفحة الدخول</a></p>
</main>
<script src="/editor-reset.js"></script>
</body>
</html>
