name: Regression tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block web uploads over editor files
        if: github.event_name == 'push'
        run: node scripts/guard-web-upload.js "${{ github.event.before }}..${{ github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Unify asset versions
        run: node scripts/bump-asset-version.js 20261011-11
      - name: Run regression suite
        run: npm test
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elan-scents-test-reports-${{ github.run_id }}
          path: reports/test-runs/
          if-no-files-found: warn
          retention-days: 30
