name: Fetch public store feeds (temporary)

# Temporary (owner approved on 2026-11-20 and again on 2026-11-23: "use the GitHub server"): saves the PUBLIC pages of the two trial stores
# (Afnan Egypt, Emarati Scents) because the working session cannot open those sites. The first run of 2026-11-23 asked for every section and the
# stores answered HTTP 429 (too many requests); this run is gentler: only the few sections that hold offers or bundles, one request every 10 seconds,
# the server's Retry-After honoured, and it STOPS a store after three refusals in a row. Public pages only (no login, no secret).
# Runs only on the temporary branch tmp/fetch-store-feeds; the result goes to tmp/store-feeds-data, which is emptied afterwards.

on:
  push:
    branches: [tmp/fetch-store-feeds]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download the public pages
        run: |
          mkdir -p sections
          cat > fetch.py <<'PY'
          import json, re, time, urllib.parse, urllib.request, urllib.error
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          # only the sections that can hold offers or bundles
          WANT = {
              'emarati-scents': ('https://emaratiscents.com', ['insane-deals', 'bundles', 'zeina-elnaggar-s-signature-bundles', 'lattafa-luxury-gift-sets', 'sale', 'must-try', 'eclaire-family💫', 'yara-asad-elixir']),
              'afnan-egypt': ('https://egypt.afnan.com', ['white-friday-sale', 'eid-special-offer']),
          }
          PAUSE = 10
          def get(url):
              """returns (status, body); honours Retry-After on 429, at most 2 waits per request"""
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': 'application/json'})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      if e.code == 429 and attempt < 2:
                          wait = min(int(e.headers.get('Retry-After') or 60), 120)
                          print('  429, waiting', wait, 's', url); time.sleep(wait + 5); continue
                      print('  http', e.code, url); return e.code, b''
                  except Exception as e:
                      print('  retry', attempt, url, e); time.sleep(5)
              return 0, b''
          def slug(s):
              return re.sub(r'[^a-z0-9]+', '_', s.lower()).strip('_') or 'x'
          for name, (base, handles) in WANT.items():
              print('==', name)
              refused = 0
              for h in handles:
                  if refused >= 3:
                      print(' stopping this store after three refusals in a row'); break
                  items, page, ok = [], 1, True
                  while page <= 9:
                      st, raw = get(f'{base}/collections/{urllib.parse.quote(h)}/products.json?limit=250&page={page}')
                      if st != 200: ok = False; break
                      ps = json.loads(raw).get('products', [])
                      if not ps: break
                      for p in ps:
                          vs = p.get('variants') or []
                          prices = [float(v['price']) for v in vs if v.get('price')]
                          cmp_ = [float(v['compare_at_price']) for v in vs if v.get('compare_at_price')]
                          items.append({'handle': p['handle'], 'title': p['title'], 'available': any(v.get('available') for v in vs),
                                        'price': min(prices) if prices else None, 'compare_at': max(cmp_) if cmp_ else None})
                      page += 1; time.sleep(PAUSE)
                  refused = 0 if ok else refused + 1
                  path = f'sections/{name}-col-{slug(h)}.json'
                  open(path, 'w', encoding='utf-8').write(json.dumps({'handle': h, 'ok': ok, 'products': items}, ensure_ascii=False))
                  print('saved', path, 'ok' if ok else 'REFUSED', len(items), 'products')
                  time.sleep(PAUSE)
          PY
          python3 fetch.py
          ls -l sections
      - name: Hand the files to the working session (temporary data branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gzip -9 sections/*
          mkdir handoff && cp -r sections handoff/
          cd handoff
          git init -q -b tmp/store-feeds-data
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add sections
          git commit -qm 'tmp: the offer and bundle sections of the two trial stores (to be emptied)'
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp/store-feeds-data
