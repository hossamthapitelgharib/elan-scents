<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة المتجر · Élan Scents</title>
  <link rel="stylesheet" href="/fonts.css?v=20261014-08">
  <link rel="stylesheet" href="/portal.css?v=20261014-08">
</head>
<body>
  <header>
    <div><small>Élan Scents · Store Portal</small><h1>لوحة المتجر</h1></div>
    <button id="logout" class="ghost" hidden>تسجيل الخروج</button>
  </header>
  <main>
    <section id="login" class="panel">
      <h2>دخول المتجر</h2>
      <p>استخدم حساب مدير المتجر لعرض الطلبات المرتبطة بمتجرك فقط.</p>
      <form id="loginForm">
        <input name="email" type="email" placeholder="البريد الإلكتروني" required>
        <input name="password" type="password" placeholder="كلمة المرور" required>
        <button class="primary">دخول</button>
      </form>
      <p id="message"></p>
    </section>
    <section id="app" hidden>
      <div id="stats" class="stats"></div>
      <p id="ordersSummary" class="muted" hidden></p>
      <p id="storeOrdersError" class="platform-error" role="alert" hidden></p>
      <div id="orders" class="stack"></div>
      <button id="loadMoreOrders" class="ghost" type="button" hidden>تحميل المزيد من الطلبات</button>
    </section>
  </main>
  <script src="/portal.js?v=20261014-08"></script>
  <script src="/store-dashboard.js?v=20261014-08"></script>
</body>
</html>
