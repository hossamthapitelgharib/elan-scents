<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>لوحة المتجر · Élan Scents</title>
  <link rel="stylesheet" href="/fonts.css?v=20261030-02">
  <link rel="stylesheet" href="/portal.css?v=20261030-02">
</head>
<body>
  <header>
    <div><small>Élan Scents · Store Portal</small><h1>لوحة المتجر</h1></div>
    <button id="logout" class="ghost" hidden>تسجيل الخروج</button>
  </header>
  <main>
    <section id="login" class="panel">
      <h2>دخول المتجر</h2>
      <p>استخدم حساب مدير المتجر لعرض الطلبات المرتبطة بمتجرك فقط.</p>
      <form id="loginForm">
        <input name="email" type="email" placeholder="البريد الإلكتروني" required>
        <input name="password" type="password" placeholder="كلمة المرور" required>
        <button class="primary">دخول</button>
      </form>
      <p id="message"></p>
    </section>
    <section id="app" hidden>
      <p id="noStoreNotice" class="panel" role="status" hidden>هذا الحساب غير مرتبط بأي متجر بعد، فلا توجد طلبات لعرضها. اطلب من إدارة المنصة ربطه بمتجرك ثم أعد تحميل الصفحة.</p>
      <div id="stats" class="stats"></div>
      <form id="orderFilters" class="platform-filters" aria-label="تصفية الطلبات">
        <select name="status" aria-label="حالة الطلب">
          <option value="">كل الحالات</option>
          <option value="awaiting_store_confirmation">بانتظار التنفيذ</option>
          <option value="store_confirmed">تم التأكيد</option>
          <option value="processing">قيد التجهيز</option>
          <option value="shipped">تم الشحن</option>
          <option value="delivered">تم التسليم</option>
          <option value="store_rejected">مرفوض</option>
          <option value="store_cancelled">ملغى</option>
        </select>
        <input name="q" type="search" maxlength="60" placeholder="ابحث برقم التتبع أو اسم العميل أو هاتفه" aria-label="بحث في الطلبات">
        <button class="ghost" type="submit">بحث</button>
        <button id="refreshOrders" class="ghost" type="button">تحديث</button>
      </form>
      <p id="ordersSummary" class="muted" hidden></p>
      <p id="storeOrdersError" class="platform-error" role="alert" hidden></p>
      <p id="orderActionError" class="platform-error" role="alert" hidden></p>
      <div id="orders" class="stack"></div>
      <button id="loadMoreOrders" class="ghost" type="button" hidden>تحميل المزيد من الطلبات</button>
    </section>
  </main>
  <script src="/auth-session.js?v=20261030-02"></script>
  <script src="/portal.js?v=20261030-02"></script>
  <script src="/store-dashboard.js?v=20261030-02"></script>
</body>
</html>
