name: Live browser check

# Opens the real shop in a real Chromium on a phone-sized window (scripts/live-browser-check.js), checks the title and counters under the
# hero on the home page and on inner pages, and keeps the screenshots as a downloadable artifact ("live-shots").
# Run it by hand from the Actions tab (Run workflow). It only reads the public site and clicks; it uses no secret.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site address to open
        default: https://elan-scents.hossamthapitelgharib.workers.dev
      auth_probe:
        description: Verify a live Turnstile token against Supabase using a nonexistent identity; creates no account
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  browser:
    # Pinned like the browser job in tests.yml for stable browser dependencies.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Open the live site
        env:
          SITE_URL: ${{ github.event.inputs.url || 'https://elan-scents.hossamthapitelgharib.workers.dev' }}
        run: node scripts/live-browser-check.js "$SITE_URL" live-shots
      - name: Verify live Turnstile without creating an account
        if: ${{ inputs.auth_probe }}
        env:
          SITE_URL: ${{ github.event.inputs.url || 'https://elan-scents.hossamthapitelgharib.workers.dev' }}
        run: node scripts/live-turnstile-auth-probe.js "$SITE_URL"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-shots
          path: live-shots
          if-no-files-found: ignore
