<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>طلباتي | Élan Scents</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Cairo:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={theme:{extend:{colors:{elan:{gold:'#C9A227',ivory:'#FBF8F3',cream:'#F7F1E8',soft:'#F0E9DF',charcoal:'#2C2A26',muted:'#6B6560'}},fontFamily:{display:['Playfair Display','serif'],sans:['Cairo','sans-serif']}}}}</script>
</head>
<body class="bg-elan-ivory text-elan-charcoal antialiased font-sans">
  <header class="border-b border-elan-soft bg-white/80 sticky top-0">
    <div class="max-w-3xl mx-auto px-4 h-14 flex items-center justify-between">
      <a href="account.html" class="text-sm text-elan-muted">← حسابي</a>
      <span class="font-display text-sm"><span class="text-elan-gold">Élan</span> Scents</span>
    </div>
  </header>
  <main class="max-w-3xl mx-auto px-4 py-10">
    <h1 class="font-display text-2xl mb-6">طلباتي</h1>
    <div id="ordersList" class="space-y-4"></div>
    <p id="noOrders" class="text-center text-sm text-elan-muted py-12 hidden">لا توجد طلبات بعد</p>
  </main>
  <script>
    const orders = JSON.parse(localStorage.getItem('elan_orders') || '[]');
    const list = document.getElementById('ordersList');
    if (!orders.length) {
      document.getElementById('noOrders').classList.remove('hidden');
    } else {
      list.innerHTML = orders.map(o => `
        <a href="tracking.html?id=${o.id}" class="block bg-white rounded-2xl p-5 border border-elan-soft hover:border-elan-gold/30">
          <div class="flex justify-between items-start">
            <div>
              <p class="font-medium text-sm">${o.id}</p>
              <p class="text-xs text-elan-muted mt-1">${o.date}</p>
            </div>
            <span class="text-xs px-2.5 py-1 rounded-full bg-elan-cream">${o.status}</span>
          </div>
          <p class="text-sm mt-3 font-semibold">${Number(o.total).toLocaleString()} ج.م</p>
        </a>
      `).join('');
    }
  </script>
</body>
</html>
