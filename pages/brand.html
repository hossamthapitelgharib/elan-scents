<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>البراند | Élan Scents</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cairo:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            elan: { gold: '#C9A227', ivory: '#FBF8F3', cream: '#F7F1E8', soft: '#F0E9DF', charcoal: '#2C2A26', muted: '#6B6560' }
          },
          fontFamily: { display: ['Playfair Display', 'serif'], sans: ['Cairo', 'sans-serif'] }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="../assets/css/elan.css">
</head>
<body class="bg-elan-ivory text-elan-charcoal antialiased font-sans">

  <header class="sticky top-0 z-50 bg-elan-ivory/95 backdrop-blur border-b border-elan-soft/60">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <a href="../index.html" class="p-2 rounded-full hover:bg-elan-soft" aria-label="رجوع">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 19l-7-7 7-7"/></svg>
      </a>
      <a href="../index.html" class="font-display text-xl"><span class="text-elan-gold font-semibold">Élan</span> Scents</a>
      <button data-open-cart class="p-2 rounded-full hover:bg-elan-soft relative">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
        <span data-cart-badge class="absolute -top-0.5 -left-0.5 bg-elan-gold text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center font-medium hidden">0</span>
      </button>
    </div>
  </header>

  <div class="max-w-7xl mx-auto px-4 py-4">
    <nav id="breadcrumb" class="flex items-center gap-2 text-xs sm:text-sm text-elan-muted flex-wrap"></nav>
  </div>

  <main class="max-w-7xl mx-auto px-4 pb-20">
    <div id="brandHeader" class="text-center py-10 sm:py-14 mb-8">
      <div class="w-24 h-24 mx-auto mb-5 rounded-2xl bg-white border border-elan-soft shadow-soft flex items-center justify-center overflow-hidden p-3">
        <img id="brandLogo" src="" alt="" class="max-w-full max-h-full object-contain">
        <span id="brandLogoFallback" class="hidden font-display text-3xl text-elan-gold font-semibold items-center justify-center w-full h-full"></span>
      </div>
      <h1 id="brandName" class="font-display text-3xl sm:text-4xl text-elan-charcoal"></h1>
      <p id="brandNameEn" class="text-sm text-elan-gold mt-2 tracking-wide"></p>
      <p id="brandCount" class="text-sm text-elan-muted mt-4"></p>
      <p class="text-[11px] text-elan-muted mt-2 max-w-md mx-auto">العطور المعروضة من كتالوج المتاجر الشريكة على المنصة فقط — بدون ربط بموقع البراند الرسمي</p>
    </div>

    <div id="brandProducts" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 sm:gap-6"></div>
    <p id="brandEmpty" class="hidden text-center text-sm text-elan-muted py-16">لا توجد عطور متاحة لهذا البراند من متاجر المنصة حالياً — قريباً</p>
  </main>

  <div id="cartOverlay" class="fixed inset-0 bg-black/30 z-50 hidden"></div>
  <div id="cartDrawer" class="fixed top-0 right-0 z-50 w-full max-w-md h-full bg-elan-ivory flex flex-col shadow-lg" style="transform:translateX(100%);transition:transform .35s ease">
    <div class="flex items-center justify-between p-5 border-b border-elan-soft">
      <h3 class="font-display text-xl">السلة</h3>
      <button id="closeCartBtn" class="p-2">✕</button>
    </div>
    <div id="cartItems" class="flex-1 overflow-y-auto px-5"></div>
    <div class="p-5 border-t border-elan-soft">
      <div class="flex justify-between mb-4"><span class="text-sm text-elan-muted">الإجمالي</span><span id="cartTotal" class="font-semibold">0 ج.م</span></div>
      <a href="checkout.html" class="block text-center py-3 bg-elan-charcoal text-white rounded-full text-sm">إتمام الشراء</a>
    </div>
  </div>

  <script src="../assets/js/elan-data.js"></script>
  <script src="../assets/js/elan-core.js"></script>
  <script>
  (async () => {
    await ElanData.load();
    const brandId = new URLSearchParams(location.search).get('id');
    const brand = ElanData.getBrand(brandId);

    if (!brand) {
      document.getElementById('brandName').textContent = 'براند غير موجود';
      document.getElementById('brandEmpty').classList.remove('hidden');
      return;
    }

    document.title = (brand.name_ar || brand.name_en) + ' | Élan Scents';
    document.getElementById('breadcrumb').innerHTML =
      '<a href="../index.html" class="hover:text-elan-gold">الرئيسية</a><span>/</span>' +
      '<a href="../index.html#brands" class="hover:text-elan-gold">البراندات</a><span>/</span>' +
      '<span class="text-elan-charcoal">' + (brand.name_ar || brand.name_en) + '</span>';

    const logo = document.getElementById('brandLogo');
    const fallback = document.getElementById('brandLogoFallback');
    fallback.textContent = brand.logo_text || (brand.name_en || '').slice(0, 2).toUpperCase();
    if (brand.logo_url) {
      var logoSrc = brand.logo_url;
      if (logoSrc.indexOf('assets/') === 0) logoSrc = '../' + logoSrc;
      logo.src = logoSrc;
      logo.alt = brand.name_en;
      logo.onerror = function () {
        this.style.display = 'none';
        fallback.classList.remove('hidden');
        fallback.classList.add('flex');
      };
    } else {
      logo.style.display = 'none';
      fallback.classList.remove('hidden');
      fallback.classList.add('flex');
    }

    document.getElementById('brandName').textContent = brand.name_ar || brand.name_en;
    document.getElementById('brandNameEn').textContent = brand.name_en;

    // ONLY this brand's products available from partner stores (virtual catalogs)
    const items = ElanData.getBrandProducts(brandId);
    document.getElementById('brandCount').textContent =
      items.length ? (items.length + ' عطر متاح من متاجر المنصة') : 'لا عطور متاحة حالياً';

    const grid = document.getElementById('brandProducts');
    const empty = document.getElementById('brandEmpty');
    if (!items.length) {
      empty.classList.remove('hidden');
      return;
    }

    const catMap = { men: 'رجالي', women: 'نسائي', unisex: 'يونيسكس' };
    grid.innerHTML = items.map(function (p) {
      var price = (p.offer && p.offer.price) ? p.offer.price.toLocaleString() : '—';
      var storeName = (p.offer && p.offer.store) ? (p.offer.store.name_ar || p.offer.store.name_en) : '';
      return (
        '<a href="product.html?id=' + p.id + '" class="perfume-card rounded-2xl overflow-hidden border border-elan-soft/50 shadow-soft bg-white block group">' +
          '<div class="aspect-[4/5] bg-elan-cream overflow-hidden">' +
            '<img src="' + (p.image || '') + '" alt="" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">' +
          '</div>' +
          '<div class="p-3.5">' +
            '<p class="text-[11px] text-elan-gold">' + (brand.name_en || '') + '</p>' +
            '<h3 class="text-sm font-medium line-clamp-2 mt-0.5">' + (p.name_ar || p.name_en) + '</h3>' +
            '<p class="text-[11px] text-elan-muted mt-1">' + storeName + ' • ' + (catMap[p.category] || '') + '</p>' +
            '<p class="text-sm font-semibold mt-2">' + price + ' ج.م</p>' +
          '</div>' +
        '</a>'
      );
    }).join('');
  })();
  </script>
  <style>#cartDrawer.open{transform:translateX(0)!important}</style>
</body>
</html>
