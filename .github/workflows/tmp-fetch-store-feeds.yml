name: Fetch public store feeds (temporary)

# Temporary: saves the PUBLIC pages about offers, bundles and discounts of the two trial stores (Afnan Egypt, Emarati Scents), because the
# working session cannot open those sites. Runs only on the temporary branch tmp/fetch-store-feeds, reads public pages only (no login,
# no secret), few requests with a pause between them. The result goes to the temporary branch tmp/store-feeds-data, which is emptied afterwards.

on:
  push:
    branches: [tmp/fetch-store-feeds]

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Download the public pages
        run: |
          mkdir -p offers
          cat > fetch.py <<'PY'
          import json, re, time, os, urllib.request, urllib.error
          UA = 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36'
          STORES = {'afnan-egypt': 'https://egypt.afnan.com', 'emarati-scents': 'https://emaratiscents.com'}
          PAT = re.compile(r'black|friday|sale|offer|deal|bundle|discount|gift|pack|combo|clearance|عرض|عروض|خصم|خصومات|باقة|باقات|تخفيض|هدية|هدايا', re.I)
          def get(url, accept='application/json'):
              for attempt in range(3):
                  try:
                      req = urllib.request.Request(url, headers={'User-Agent': UA, 'Accept': accept})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.status, r.read()
                  except urllib.error.HTTPError as e:
                      print('  http', e.code, url); return e.code, b''
                  except Exception as e:
                      print('  retry', attempt, url, e); time.sleep(3)
              return 0, b''
          def save(path, data):
              open(path, 'wb').write(data); print('saved', path, len(data), 'bytes')
          for name, base in STORES.items():
              print('==', name)
              st, html = get(base + '/', 'text/html'); print(' home', st); save(f'offers/{name}-home.html', html); time.sleep(2)
              cols, page = [], 1
              while page <= 10:
                  st, raw = get(f'{base}/collections.json?limit=250&page={page}')
                  if st != 200: break
                  d = json.loads(raw).get('collections', [])
                  if not d: break
                  cols += d; page += 1; time.sleep(2)
              print(' collections:', len(cols))
              save(f'offers/{name}-collections.json', json.dumps(cols, ensure_ascii=False).encode())
              sel = [c for c in cols if PAT.search(c.get('handle', '')) or PAT.search(c.get('title', ''))]
              print(' selected:', [(c['handle'], c.get('products_count')) for c in sel])
              for c in sel[:40]:
                  items, page = [], 1
                  while page <= 8:
                      st, raw = get(f"{base}/collections/{c['handle']}/products.json?limit=250&page={page}")
                      if st != 200: break
                      ps = json.loads(raw).get('products', [])
                      if not ps: break
                      for p in ps:
                          items.append({'id': p['id'], 'handle': p['handle'], 'title': p['title'], 'tags': p.get('tags'),
                                        'variants': [{'price': v['price'], 'compare_at_price': v.get('compare_at_price'), 'available': v['available'], 'title': v.get('title')} for v in p['variants']],
                                        'body_text': re.sub(r'\s+', ' ', re.sub(r'<[^>]+>', ' ', p.get('body_html') or ''))[:600]})
                      page += 1; time.sleep(2)
                  save(f"offers/{name}-col-{c['handle']}.json", json.dumps({'collection': c, 'products': items}, ensure_ascii=False).encode())
          PY
          python3 fetch.py
          ls -l offers | head -80
      - name: Hand the files to the working session (temporary data branch)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          gzip -9 offers/*
          mkdir handoff && cp -r offers handoff/offers
          cd handoff
          git init -q -b tmp/store-feeds-data
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add offers
          git commit -qm 'tmp: public offer pages of the two trial stores (to be emptied)'
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" tmp/store-feeds-data
