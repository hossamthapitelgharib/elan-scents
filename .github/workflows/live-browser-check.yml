name: Live browser check

# Opens the real shop in a real Chromium on a phone-sized window (scripts/live-browser-check.js), checks the title and counters under the
# hero on the home page and on inner pages, and keeps the screenshots as a downloadable artifact ("live-shots").
# Run it by hand from the Actions tab (Run workflow). It only reads the public site and clicks; it uses no secret.

on:
  workflow_dispatch:
    inputs:
      url:
        description: Site address to open
        default: https://elan-scents.hossamthapitelgharib.workers.dev

permissions:
  contents: read

jobs:
  browser:
    # pinned like the browser job in tests.yml: Playwright 1.56 has no Chromium build for the newer ubuntu-latest image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Open the live site
        env:
          SITE_URL: ${{ github.event.inputs.url || 'https://elan-scents.hossamthapitelgharib.workers.dev' }}
        run: node scripts/live-browser-check.js "$SITE_URL" live-shots
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-shots
          path: live-shots
          if-no-files-found: ignore
