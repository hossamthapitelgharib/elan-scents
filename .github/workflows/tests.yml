name: Regression tests

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Block web uploads over editor files
        if: github.event_name == 'push'
        run: node scripts/guard-web-upload.js "${{ github.event.before }}..${{ github.sha }}"
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Run regression suite and capture report
        shell: bash
        run: |
          mkdir -p reports/test-runs
          set -o pipefail
          npm test 2>&1 | tee "reports/test-runs/npm-test-${GITHUB_RUN_ID}.log"
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: elan-scents-test-reports-${{ github.run_id }}
          path: reports/test-runs/
          if-no-files-found: warn
          retention-days: 30

  # The same pages in a real Chromium (phone 390, tablet 820, laptop 1366): the storefront and the owner's editor.
  # A separate job so the fast Node suite above stays the quick signal; needs no secret and reaches no live service.
  browser:
    # pinned: Playwright 1.56 has no Chromium build for the newer ubuntu-latest image (26.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm ci --no-audit --no-fund
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run the real-browser tests
        run: npm run test:browser
