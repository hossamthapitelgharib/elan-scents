<!DOCTYPE html>

<div class="ic"><button data-sheet="fav"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="url(#gg)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" ><path d="M12 20s-7-4.5-7-10a4 4 0 017-2.5A4 4 0 0119 10c0 5.5-7 10-7 10z"/></svg></button><button data-sheet="cart"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="url(#gg)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="20" r="1"/><circle cx="17" cy="20" r="1"/><path d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg></button><button id="lg" class="en">EN</button></div>
</header>
<div id="quickSearch" hidden><form id="quickSearchForm"><input id="quickSearchInput" type="search" autocomplete="off"><button type="submit" aria-label="search">⌕</button></form><div id="quickSearchResults"></div></div>

<script src="/texts.js"></script>
